name: monthly-ingest

# Steady state only: one new archive month → one partition → ~150 MB to R2.
# The 1.8 TB historical backfill does not run here; see pipeline/README.md.

on:
  schedule:
    # 04:00 UTC on the 5th — the archive publishes the previous month a few days in.
    - cron: "0 4 5 * *"
  workflow_dispatch:
    inputs:
      partition:
        description: "Month to materialize (YYYY-MM). Defaults to last month."
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    env:
      # Without this a dropped secret would publish nothing and still report success.
      BERG_REQUIRE_R2: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve partition
        id: p
        run: |
          if [ -n "${{ inputs.partition }}" ]; then
            echo "month=${{ inputs.partition }}" >> "$GITHUB_OUTPUT"
          else
            echo "month=$(date -u -d 'last month' +%Y-%m)" >> "$GITHUB_OUTPUT"
          fi

      - run: uv sync --frozen

      # build_month.py, not `dagster asset materialize --select '*' --partition <month>`:
      # ingest is monthly-partitioned but the published Parquet is DAILY, and one --partition
      # key cannot mean both. '2026-06' is not even a valid key ('2026-06-01' is), and with
      # the valid key `--select '*'` would export a single day and call the month done.
      # build_month does the monthly -> daily fan-out, and is the same path the backfill runs.
      - name: Build the month
        run: uv run python scripts/build_month.py '${{ steps.p.outputs.month }}'

      # Written last, and seeded from the bucket: this checkout holds only the new month, so a
      # manifest built from local files alone would drop the rest of the archive.
      - name: Publish manifest
        run: |
          uv run dagster asset materialize --select manifest

name: monthly-ingest

# Steady state only: one new archive month → one partition → ~150 MB to R2.
# The 1.8 TB historical backfill does not run here; see pipeline/README.md.

on:
  schedule:
    # 04:00 UTC on the 5th — the archive publishes the previous month a few days in.
    - cron: "0 4 5 * *"
  workflow_dispatch:
    inputs:
      partition:
        description: "Month to materialize (YYYY-MM). Defaults to last month."
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    env:
      # Without this a dropped secret would publish nothing and still report success.
      BERG_REQUIRE_R2: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve partition
        id: p
        run: |
          if [ -n "${{ inputs.partition }}" ]; then
            echo "month=${{ inputs.partition }}" >> "$GITHUB_OUTPUT"
          else
            echo "month=$(date -u -d 'last month' +%Y-%m)" >> "$GITHUB_OUTPUT"
          fi

      - run: uv sync --frozen

      - name: Materialize
        run: |
          uv run dagster asset materialize \
            --select '*' \
            --partition '${{ steps.p.outputs.month }}'

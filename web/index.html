<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b10" />
    <title>berg — Swiss trains, live through history</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="brand-mark">B</div>
        <div class="loading-copy">
          <strong>Loading the railway</strong>
          <span id="loading-label">Starting DuckDB…</span>
        </div>
        <div class="progress-track"><i id="loading-progress"></i></div>
      </div>
    </div>

    <header id="topbar" class="glass hidden">
      <a class="brand" href="#" aria-label="Reset map view"><b>berg</b><span>rail observer</span></a>
      <div class="sim-state">
        <time id="time">--</time>
        <span id="speed-badge">600×</span>
        <span id="count">0 trains</span>
      </div>
      <button id="command-button" class="command-button" type="button">
        <span>Search trains or change speed</span><kbd>Ctrl K</kbd>
      </button>
    </header>

    <section id="filters" class="glass hidden" aria-label="Train filters">
      <div class="panel-label">Services</div>
      <div id="filter-chips" class="chips"></div>
      <div class="divider"></div>
      <div class="mode-row">
        <button id="mode-type" class="text-button on" type="button">Service</button>
        <button id="mode-delay" class="text-button" type="button">Delay</button>
      </div>
      <div id="legend" class="legend"></div>
      <div id="archive-meta" class="micro"></div>
    </section>

    <aside id="details" class="glass details hidden" aria-live="polite">
      <button id="details-close" class="icon-button close" type="button" aria-label="Close">×</button>
      <div id="details-content"></div>
    </aside>

    <div id="command" class="command-backdrop hidden" role="dialog" aria-modal="true">
      <div class="command-panel">
        <div class="command-input-row">
          <span class="search-icon">⌕</span>
          <input id="command-input" autocomplete="off" spellcheck="false"
            placeholder="Train, line, or YYYY-MM-DD HH:MM…" />
          <kbd>Esc</kbd>
        </div>
        <div id="command-context" class="command-context"></div>
        <div id="command-results" class="command-results"></div>
      </div>
    </div>

    <div id="error" class="error hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

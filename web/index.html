<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>berg — every Swiss train since 2016</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #e8eaf0;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #controls {
        position: absolute;
        left: 16px;
        bottom: 16px;
        z-index: 10;
        width: min(420px, calc(100vw - 32px));
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(14, 17, 24, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: #e8eaf0;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 4px 9px;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      button.on {
        background: #38bdf8;
        border-color: #38bdf8;
        color: #06121c;
        font-weight: 600;
      }
      #time {
        font-variant-numeric: tabular-nums;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #scrub {
        width: 100%;
        margin: 4px 0 10px;
        accent-color: #38bdf8;
      }
      .muted {
        color: #949bab;
      }
      .small {
        font-size: 11px;
        margin-top: 2px;
      }
      #count {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin-left: auto;
        color: #949bab;
      }
      .key {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .key i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

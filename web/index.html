<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b10" />
    <title>berg — Swiss trains, live through history</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <div class="brand-mark">B</div>
        <div class="loading-copy">
          <strong>Loading the railway</strong>
          <span id="loading-label">Starting DuckDB…</span>
        </div>
        <div class="progress-track"><i id="loading-progress"></i></div>
      </div>
    </div>

    <header id="topbar" class="hidden">
      <nav class="map-actions glass" aria-label="Map controls">
        <button id="command-button" class="map-action" type="button">
          <span class="map-action-icon" aria-hidden="true">⌕</span>
          <span class="map-action-copy"><strong>Find a train</strong><small>Identity, line, or date</small></span>
          <kbd>Ctrl K</kbd>
        </button>
        <button id="playback-button" class="map-action" type="button">
          <span id="playback-icon" class="map-action-icon" aria-hidden="true">Ⅱ</span>
          <span class="map-action-copy"><strong id="playback-label">Pause playback</strong><small>Historical simulation</small></span>
          <kbd>Space</kbd>
        </button>
        <button id="filter-button" class="map-action" type="button" aria-expanded="false" aria-controls="filters">
          <span class="map-action-icon display-icon" aria-hidden="true">◫</span>
          <span class="map-action-copy"><strong>Train display</strong><small id="filter-summary">All services · service colours</small></span>
          <span class="map-action-chevron" aria-hidden="true">›</span>
        </button>
      </nav>

      <div class="clock-card glass" aria-label="Simulation time">
        <span id="hud-date" class="hud-date">--</span>
        <time id="time">--:--:--</time>
        <div class="clock-meta">
          <button id="speed-badge" type="button" aria-label="Change playback speed">600×</button>
          <span id="count">0 trains</span>
        </div>
      </div>
    </header>

    <section id="filters" class="glass hidden" aria-label="Train filters">
      <div class="filter-heading">
        <div><strong>Train display</strong><small>Choose what appears on the map</small></div>
        <button id="filters-close" class="icon-button" type="button" aria-label="Close train display">×</button>
      </div>
      <div class="panel-label">Services</div>
      <div id="filter-chips" class="chips"></div>
      <div class="divider"></div>
      <div class="panel-label">Colour arrows by</div>
      <div class="mode-row">
        <button id="mode-type" class="text-button on" type="button">Service</button>
        <button id="mode-delay" class="text-button" type="button">Delay</button>
      </div>
      <div id="legend" class="legend"></div>
      <div id="archive-meta" class="micro"></div>
      <div class="micro map-credits">
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">© OpenStreetMap</a>
        · <a href="https://openfreemap.org/" target="_blank" rel="noreferrer">OpenFreeMap</a>
        · <a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md" target="_blank" rel="noreferrer">Terrain sources</a>
      </div>
    </section>

    <aside id="details" class="glass details hidden" aria-live="polite">
      <button id="details-close" class="icon-button close" type="button" aria-label="Close">×</button>
      <div id="details-content"></div>
    </aside>

    <div id="command" class="command-backdrop hidden" role="dialog" aria-modal="true">
      <div class="command-panel">
        <div class="command-input-row">
          <span class="search-icon">⌕</span>
          <input id="command-input" autocomplete="off" spellcheck="false"
            placeholder="Train, line, or YYYY-MM-DD HH:MM…" />
          <kbd>Esc</kbd>
        </div>
        <div id="command-context" class="command-context"></div>
        <div id="command-results" class="command-results"></div>
      </div>
    </div>

    <div id="error" class="error hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

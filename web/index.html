<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0c0e" />
    <title>berg — European trains, live through history</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="loading" role="status" aria-live="polite">
      <div class="loading-card">
        <strong class="wordmark">berg</strong>
        <span id="loading-label">Starting DuckDB…</span>
        <div class="progress-track"><i id="loading-progress"></i></div>
      </div>
    </div>

    <div id="topbar" class="hidden">
      <div class="left-rail">
        <nav class="toolbar panel" aria-label="Map controls">
          <span class="wordmark">berg</span>
          <button id="command-button" class="search-button" type="button" aria-label="Find a train">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
            <span>Search trains or dates</span>
            <kbd>Ctrl K</kbd>
          </button>
          <button id="filter-button" class="icon-button" type="button" aria-label="Map layers"
            aria-expanded="false" aria-controls="filters">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2.5 5.5 3L8 8.5l-5.5-3Z" /><path d="m2.5 8.5 5.5 3 5.5-3" /><path d="m2.5 11 5.5 3 5.5-3" /></svg>
          </button>
        </nav>

        <section id="filters" class="panel hidden" aria-label="Map layers">
          <header class="panel-header">
            <h2>Map layers</h2>
            <button id="filters-close" class="icon-button small" type="button" aria-label="Close map layers">
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
            </button>
          </header>
          <div class="panel-section">
            <h3>Show</h3>
            <div id="layer-toggles" class="toggle-list"></div>
          </div>
          <div id="country-section" class="panel-section">
            <h3>Countries</h3>
            <div id="country-toggles" class="toggle-list"></div>
          </div>
          <div class="panel-section">
            <h3>Services</h3>
            <div id="filter-chips" class="chips"></div>
          </div>
          <div class="panel-section">
            <h3>Colour trains by</h3>
            <div class="segmented" role="group" aria-label="Colour trains by">
              <button id="mode-type" type="button" aria-pressed="false">Service</button>
              <button id="mode-delay" class="on" type="button" aria-pressed="true">Delay</button>
            </div>
            <div id="legend" class="legend"></div>
          </div>
          <footer class="panel-footer">
            <div id="archive-meta"></div>
            <details class="sources">
              <summary>Sources &amp; licences</summary>
              <div id="data-sources"></div>
            </details>
          </footer>
        </section>
      </div>

      <div class="right-rail">
        <section id="activity" class="panel" aria-label="Trains running over time">
          <header class="activity-header">
            <div>
              <h2>Trains running</h2>
              <span id="activity-scope"></span>
            </div>
            <strong id="count">0</strong>
          </header>
          <div id="activity-chart" class="activity-chart"></div>
        </section>

        <aside id="details" class="panel details hidden" aria-live="polite">
          <button id="details-close" class="icon-button small close" type="button" aria-label="Close">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
          </button>
          <div id="details-content"></div>
        </aside>
      </div>

      <div class="bottom-rail">
        <div id="coverage" class="coverage hidden" role="status"></div>
        <div id="playbar" class="panel" aria-label="Playback">
          <button id="playback-button" class="play-button" type="button">
            <svg id="icon-pause" class="icon filled" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="2.75" height="10" rx=".75" /><rect x="9.25" y="3" width="2.75" height="10" rx=".75" /></svg>
            <svg id="icon-play" class="icon filled hidden" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6a.7.7 0 0 0 1.06.6l7.6-4.8a.7.7 0 0 0 0-1.2l-7.6-4.8A.7.7 0 0 0 5 3.2Z" /></svg>
            <span id="playback-label" class="sr-only">Pause playback</span>
          </button>
          <div class="clock">
            <time id="time">--:--:--</time>
            <span id="hud-date">--/--/----</span>
          </div>
          <div id="speeds" class="segmented" role="group" aria-label="Playback speed"></div>
        </div>
      </div>
    </div>

    <div id="command" class="command-backdrop hidden" role="dialog" aria-modal="true" aria-label="Search">
      <div class="command-panel">
        <div class="command-input-row">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
          <input id="command-input" autocomplete="off" spellcheck="false"
            placeholder="Train, line, country, or DD/MM/YYYY HH:MM" />
          <kbd>Esc</kbd>
        </div>
        <div id="command-context" class="command-context"></div>
        <div id="command-results" class="command-results"></div>
      </div>
    </div>

    <div id="error" class="error hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

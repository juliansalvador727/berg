[project]
name = "berg-geometry"
version = "0.1.0"
description = "One-off OSM job: rail graph → per-station-pair polylines → routes.bin."
requires-python = ">=3.12"
dependencies = [
    "pyrosm>=0.6",
    "networkx>=3.3",
    "shapely>=2.0",
    "numpy>=2.0",
    "duckdb>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/berg_geometry"]

[tool.ruff]
line-length = 100

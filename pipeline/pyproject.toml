[project]
name = "berg-pipeline"
version = "0.1.0"
description = "Dagster + DuckDB pipeline turning Ist-Daten archives into per-day leg Parquet on R2."
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9",
    "dagster-duckdb>=0.25",
    "duckdb>=1.1",
    "boto3>=1.35",
    "httpx>=0.27",
    "zipfile-deflate64>=0.2.0",
]

[dependency-groups]
dev = [
    "dagster-webserver>=1.9",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/berg_pipeline"]

[tool.dagster]
module_name = "berg_pipeline.definitions"

[tool.ruff]
line-length = 100
